<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ginger Recovery Tracker</title>
<style>
:root{--bg:#f6f7f8;--card:#fff;--text:#16181d;--muted:#68707d;--line:#d9dee5;--accent:#2457d6;--warn:#b42318;--warnbg:#fff0ed;--done:#eef2f5;--badge:#eef3ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:14px}.topbar{position:sticky;top:0;z-index:10;background:rgba(246,247,248,.96);padding-top:8px}
h1{font-size:24px;margin:0 0 8px}h2{font-size:16px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.03em}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.nav button,.reset{padding:11px 8px;border:1px solid var(--line);background:#fff;border-radius:9px;font:inherit}
.date{font-weight:700;margin:8px 0 4px}.progress{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700}
.nextbox{margin-top:10px;padding:12px;border:2px solid var(--accent);border-radius:10px;background:#fff}.nextbox .label{font-size:12px;font-weight:800;color:var(--accent);text-transform:uppercase}.nextbox .main{font-size:18px;font-weight:800;margin-top:2px}
.group{margin-top:12px}.group-title{font-size:13px;font-weight:800;color:var(--muted);margin:8px 2px}
.row{display:grid;grid-template-columns:auto 74px 1fr;gap:10px;align-items:center;min-height:62px;padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.row.overdue{border-color:#f1b5ac;background:var(--warnbg)}.row.done{opacity:.55;background:var(--done)}.row input{width:26px;height:26px}.time{font-weight:800;font-size:16px}.med{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:3px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.badge{font-size:10px;font-weight:800;padding:3px 6px;border-radius:999px;background:var(--badge);color:#29437f}.badge.warn{background:#ffe8e3;color:var(--warn)}.badge.food{background:#eef7ea;color:#28681f}
.care .row{grid-template-columns:auto 1fr}.care .row span{font-weight:650}textarea{width:100%;min-height:100px;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.upcoming{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.upcoming div+div{margin-top:6px}.reset{width:100%;margin:16px 0;color:#8a1c13}
.empty{padding:12px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);background:#fff}
@media(max-width:520px){.wrap{padding:10px}.row{grid-template-columns:auto 66px 1fr;gap:8px;padding:10px 9px}.nav button{font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Ginger Recovery Tracker</h1>
    <div class="nav"><button id="prev">← Previous</button><button id="today">Today</button><button id="nextDay">Next →</button></div>
    <div class="date" id="dateLabel"></div>
    <div class="progress"><span id="progressText"></span><span id="remainingText"></span></div>
    <div class="nextbox" id="nextBanner"></div>
  </div>
  <section id="medSection"></section>
  <section class="care"><h2>Daily Care</h2><div id="careList"></div></section>
  <section><h2>Notes</h2><textarea id="notes" placeholder="Notes for this day..."></textarea></section>
  <section><h2>Upcoming</h2><div class="upcoming">
    <div><b>Oct 6, 2026 · 10:45 AM</b> — Suture removal</div>
    <div><b>Around Nov 17, 2026</b> — Repeat X-rays</div>
    <div><b>6–8 weeks</b> — Activity restriction: no running, jumping, stairs, off-leash activity, or play</div>
  </div></section>
  <button class="reset" id="reset">Reset this day</button>
</div>
<script>
const MEDS=[
{name:"Gabapentin 100 mg",start:"2026-09-23",end:"2026-10-22",doses:[["gaba-0800","8:00 AM",480],["gaba-1600","4:00 PM",960],["gaba-0000","12:00 AM",0]],note:"Every 8h for 30 days",badges:[]},
{name:"Cephalexin 250 mg",start:"2026-09-23",end:"2026-09-27",doses:[["ceph-0600","6:00 AM",360],["ceph-1400","2:00 PM",840],["ceph-2200","10:00 PM",1320]],note:"Every 8h for 5 days",badges:["WITH FOOD"]},
{name:"Trazodone 50 mg",start:"2026-09-23",end:"2026-10-06",doses:[["traz-0800","8:00 AM",480],["traz-1600","4:00 PM",960],["traz-0000","12:00 AM",0]],note:"Every 8–12h for 14 days",badges:["VET INTERVAL"]},
{name:"Acetaminophen 80 mg",start:"2026-09-23",end:"2026-09-25",doses:[["acet-0900","9:00 AM",540],["acet-1700","5:00 PM",1020],["acet-0100","1:00 AM",60]],note:"Every 8h through Sep 25. Do not change times without veterinarian approval.",badges:[]},
{name:"Robenacoxib (Onsior) 10 mg",start:"2026-09-26",end:"2026-10-09",doses:[["ons-0800","8:00 AM",480]],note:"Once daily",badges:["FULL MEAL"]}
];
const CARE=["Cold compress 1","Cold compress 2","Cold compress 3","Incision check AM","Incision check PM","Bedding washed","E-collar / no licking confirmed","Appetite / water checked"];
const pad=n=>String(n).padStart(2,"0");
function key(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parseKey(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(k,n){const d=parseKey(k);d.setDate(d.getDate()+n);return key(d)}
function formatDate(k){return parseKey(k).toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"})}
function nowKey(){return key(new Date())}
function load(k){try{const x=JSON.parse(localStorage.getItem("ginger:"+k)||"{}");return {checks:x.checks||{},notes:x.notes||"",givenAt:x.givenAt||{}}}catch{return {checks:{},notes:"",givenAt:{}}}}
function save(k,d){localStorage.setItem("ginger:"+k,JSON.stringify(d))}
function activeMeds(k){return MEDS.filter(m=>k>=m.start&&k<=m.end)}
function allTasks(k){return activeMeds(k).flatMap(m=>m.doses.map(([id,label,mins])=>({id,label,mins,name:m.name,note:m.note,badges:m.badges})))}
function groupFor(m){if(m<360)return"OVERNIGHT";if(m<720)return"MORNING";if(m<1020)return"AFTERNOON";if(m<1320)return"EVENING";return"OVERNIGHT"}
function fmtGiven(ts){return new Date(ts).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}
let selected=nowKey(),data=load(selected);
function setDay(k){selected=k;data=load(k);render()}
function toggleMed(id){const on=!data.checks[id];data.checks[id]=on;if(on)data.givenAt[id]=new Date().toISOString();else delete data.givenAt[id];save(selected,data);render()}
function toggleCare(i){const id="care-"+i;data.checks[id]=!data.checks[id];save(selected,data);render()}
function badgeHtml(b){return (b||[]).map(x=>`<span class="badge ${x.includes("FOOD")||x.includes("MEAL")?"food":x.includes("VET")?"warn":""}">${x}</span>`).join("")}
function render(){
  const isToday=selected===nowKey(),now=new Date(),nowMins=now.getHours()*60+now.getMinutes(),tasks=allTasks(selected);
  document.getElementById("dateLabel").textContent=formatDate(selected)+(isToday?" (today)":"");
  const ids=[...tasks.map(t=>t.id),...CARE.map((_,i)=>"care-"+i)],done=ids.filter(id=>data.checks[id]).length;
  document.getElementById("progressText").textContent=`${done} / ${ids.length} completed`;
  document.getElementById("remainingText").textContent=`${ids.length-done} remaining`;
  const incomplete=tasks.filter(t=>!data.checks[t.id]).sort((a,b)=>a.mins-b.mins);
  let nt=isToday?(incomplete.find(t=>t.mins>=nowMins)||incomplete[0]||null):(incomplete[0]||null);
  document.getElementById("nextBanner").innerHTML=nt?`<div class="label">Next</div><div class="main">${nt.label} · ${nt.name}</div><div class="badges">${badgeHtml(nt.badges)}</div>`:`<div class="label">Next</div><div class="main">All scheduled medications complete for this day.</div>`;
  const section=document.getElementById("medSection");section.innerHTML="";
  if(!tasks.length){section.innerHTML='<h2>Medications</h2><div class="empty">No medications scheduled for this date.</div>'}
  else{
    const overdue=isToday?tasks.filter(t=>!data.checks[t.id]&&t.mins<nowMins):[],overdueIds=new Set(overdue.map(t=>t.id));
    const renderGroup=(title,list,flag)=>{
      if(!list.length)return;
      list.sort((a,b)=>{const ad=!!data.checks[a.id],bd=!!data.checks[b.id];return ad!==bd?(ad?1:-1):a.mins-b.mins});
      const g=document.createElement("div");g.className="group";g.innerHTML=`<div class="group-title">${title}</div>`;
      list.forEach(t=>{const checked=!!data.checks[t.id],row=document.createElement("label");row.className="row"+(checked?" done":"")+(flag&&!checked?" overdue":"");
        const status=checked?(data.givenAt[t.id]?`Given ${fmtGiven(data.givenAt[t.id])}`:"Completed"):(flag?"Overdue":t.note);
        row.innerHTML=`<input type="checkbox" ${checked?"checked":""}><div class="time">${t.label}</div><div><div class="med">${t.name}</div><div class="badges">${badgeHtml(t.badges)}</div><div class="meta">${status}</div></div>`;
        row.querySelector("input").onchange=()=>toggleMed(t.id);g.appendChild(row)});
      section.appendChild(g)
    };
    renderGroup("OVERDUE / NOW",overdue,true);
    ["MORNING","AFTERNOON","EVENING","OVERNIGHT"].forEach(gr=>renderGroup(gr,tasks.filter(t=>groupFor(t.mins)===gr&&!overdueIds.has(t.id)),false))
  }
  const care=document.getElementById("careList");care.innerHTML="";
  CARE.map((label,i)=>({label,i,id:"care-"+i,done:!!data.checks["care-"+i]})).sort((a,b)=>Number(a.done)-Number(b.done)).forEach(x=>{const r=document.createElement("label");r.className="row"+(x.done?" done":"");r.innerHTML=`<input type="checkbox" ${x.done?"checked":""}><span>${x.label}</span>`;r.querySelector("input").onchange=()=>toggleCare(x.i);care.appendChild(r)});
  const notes=document.getElementById("notes");if(notes.value!==data.notes)notes.value=data.notes||""
}
document.getElementById("prev").onclick=()=>setDay(addDays(selected,-1));
document.getElementById("today").onclick=()=>setDay(nowKey());
document.getElementById("nextDay").onclick=()=>setDay(addDays(selected,1));
document.getElementById("notes").oninput=e=>{data.notes=e.target.value;save(selected,data)};
document.getElementById("reset").onclick=()=>{if(confirm("Reset all checkboxes, notes, and completion times for "+formatDate(selected)+"?")){data={checks:{},notes:"",givenAt:{}};save(selected,data);render()}};
render();
</script>
</body>
</html>
