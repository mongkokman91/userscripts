name: Materialize canonical userscripts

on:
  push:
    branches: [main]
    paths:
      - '.sync/payload.part.*'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Rebuild canonical scripts
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/payload.part.* > /tmp/userscripts.b64
          base64 --decode /tmp/userscripts.b64 > /tmp/userscripts.tar.gz
          mkdir -p scripts
          tar -xzf /tmp/userscripts.tar.gz -C scripts
          rm -rf .sync
          python3 tools/userscript_hygiene.py
      - name: Commit materialized scripts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'Materialize canonical userscripts'
            git push
          fi
