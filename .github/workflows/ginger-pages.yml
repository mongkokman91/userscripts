name: Deploy Ginger Recovery Tracker to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "ginger-recovery-tracker/**"
      - ".github/workflows/ginger-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "ginger-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}ginger-recovery-tracker/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site
        run: |
          mkdir -p _site/ginger-recovery-tracker
          cp ginger-recovery-tracker/index.html _site/ginger-recovery-tracker/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
